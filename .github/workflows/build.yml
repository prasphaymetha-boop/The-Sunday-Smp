name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip DiscordLog-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: mvn -B package
        working-directory: DiscordLog
      - uses: actions/upload-artifact@v4
        with:
          name: DiscordLog-jar
          path: DiscordLog/target/DiscordLog-*.jar
